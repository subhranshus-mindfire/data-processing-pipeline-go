linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  errcheck:
    check-type-assertions: true
    check-blank: false

linters:
  disable-all: true
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - typecheck
    - gocyclo
    - unconvert
    - goconst
    - gosimple
    - unused
    - noctx
    - bodyclose
    - gocritic

run:
  timeout: 5m
  tests: true

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - dupl
        - goconst
        - gocritic
        - noctx
    - path: cmd/
      linters:
        - errcheck
