version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pipeline

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    # Port 8080 is not exposed to the host to force traffic through NGINX
    expose:
      - "8080"
    environment:
      - PORT=8080
    volumes:
      - ./data:/root/data # For exporting files if needed later
      - ./samples:/root/samples # Mount generated stress test data
