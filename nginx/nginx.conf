events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Route API requests to the Go backend
        location /api/ {
            proxy_pass http://pipeline:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route Swagger UI to the Go backend
        location /swagger/ {
            proxy_pass http://pipeline:8080/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route static samples to the Go backend
        location /samples/ {
            proxy_pass http://pipeline:8080/samples/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
